[project]
name = "generative-recommendation-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "transformers==4.56.2",
    "hydra-core>=1.3.7",
    "omegaconf>=2.3.1",
    "tqdm>=4.70.1",
    "scikit-learn==1.7.1",
    "numpy==2.3.2",
    "pandas==2.3.2",
    "k-means-constrained==0.7.6",
    "accelerate==1.10.1",
    "sentence-transformers>=5.7.0",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
